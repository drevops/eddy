name: Draft release notes

on:
  push:
    branches:
      - main

permissions: {}

# Overlapping runs can each create a draft, so runs queue instead. 'queue: max'
# keeps every waiting run, where the default queue cancels all but the newest.
concurrency:
  group: release-drafter
  cancel-in-progress: false
  queue: max

jobs:
  release-drafter:
    permissions:
      contents: write # Create and update the draft release.
      pull-requests: read # List the merged pull requests for the notes.

    runs-on: ubuntu-26.04

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
