name: Test Scaffold

# Validates the integrity of the scaffold template itself.

on:
  push:
    branches:
      - 1.x

  pull_request:
    branches:
      - 1.x
      - 'feature/**'

permissions:
  contents: read

jobs:
  scaffold-test-devtools:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read # Read repository contents; coverage is uploaded to external Codecov.

    env:
      # Each CI job is a single project, so the pre-start step and the tests
      # share a fixed port instead of discovering one. The selenium legs must
      # use 4444 because that is what the container step publishes.
      #
      # The chromedriver legs deliberately use another port, so a run that
      # reaches the browser proves the Mink endpoint follows WEBDRIVER_PORT, not
      # the phpunit.xml literal.
      WEBDRIVER_PORT: ${{ matrix.backend == 'chromedriver' && '4455' || '4444' }}

    strategy:
      fail-fast: false

      matrix:
        # Job names include these values and are required status checks, so
        # renaming a value blocks merges until the ruleset is updated:
        # https://github.com/drevops/eddy/rules/8469831
        os: [ubuntu-latest, macos-latest]
        group: ['p0', 'p1', 'p2', 'p3', 'p4', 'p5']
        # Only the FunctionalJavascript groups (p3/p4) use a WebDriver
        # backend, so the excludes run every other group once. macOS runners
        # have no Docker, so macOS with selenium is excluded as well.
        backend: ['selenium', 'chromedriver']
        exclude:
          - group: 'p0'
            backend: 'selenium'
          - group: 'p1'
            backend: 'selenium'
          - group: 'p2'
            backend: 'selenium'
          - group: 'p5'
            backend: 'selenium'
          - os: 'macos-latest'
            backend: 'selenium'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Upgrade sqlite3 (Linux)
        if: matrix.group != 'p0' && runner.os == 'Linux'
        run: |
          wget https://www.sqlite.org/2024/sqlite-autoconf-3450300.tar.gz -O /tmp/sqlite.tar.gz
          tar -xzf /tmp/sqlite.tar.gz -C /tmp
          cd /tmp/sqlite-autoconf-3450300
          ./configure CFLAGS="-DSQLITE_ENABLE_COLUMN_METADATA=1" --prefix=/usr/local
          make && sudo make install
          sudo ldconfig

      - name: Upgrade sqlite3 (macOS)
        if: matrix.group != 'p0' && runner.os == 'macOS'
        run: |
          brew install sqlite3
          brew_prefix=$(brew --prefix sqlite3)
          echo "${brew_prefix}/bin" >> "$GITHUB_PATH"
          {
            echo "LDFLAGS=-L${brew_prefix}/lib"
            echo "CPPFLAGS=-I${brew_prefix}/include"
            echo "PKG_CONFIG_PATH=${brew_prefix}/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      # p5 swaps the coverage driver for the real xdebug extension so the
      # XDebug toggle can be tested end-to-end.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3
          extensions: gd, sqlite, pdo_sqlite
          coverage: ${{ matrix.group == 'p5' && 'xdebug' || 'pcov' }}
          ini-values: ${{ matrix.group == 'p5' && 'xdebug.mode=off' || 'pcov.directory=.' }}

      - name: Install Ahoy
        if: matrix.group == 'p3' || matrix.group == 'p5'
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64|amd64) architecture=amd64 ;;
            aarch64|arm64|armv8) architecture=arm64 ;;
            *) architecture=amd64 ;;
          esac
          sudo wget -q "https://github.com/ahoy-cli/ahoy/releases/download/v2.5.0/ahoy-bin-${os}-${architecture}" -O /usr/local/bin/ahoy
          sudo chown "$USER" /usr/local/bin/ahoy
          chmod +x /usr/local/bin/ahoy

      - name: Start Chromium (selenium backend, Linux only)
        if: runner.os == 'Linux' && matrix.backend == 'selenium' && (matrix.group == 'p3' || matrix.group == 'p4')
        run: |
          docker run -d --name chromium -p 4444:4444 selenium/standalone-chromium:latest@sha256:8c5a8629c96104c0d73df94c6437af9ab9059c4e16aa32e35b330b7d77defe0b
          for _ in $(seq 1 30); do curl -s http://localhost:4444/status | grep -q '"ready": true' && break; sleep 1; done
          curl -s http://localhost:4444/status | grep -q '"ready": true' || { echo 'ERROR: Chromium failed to become ready after 30 seconds.'; exit 1; }

      - name: Install Google Chrome (chromedriver backend, macOS)
        if: runner.os == 'macOS' && matrix.backend == 'chromedriver' && (matrix.group == 'p3' || matrix.group == 'p4')
        run: '[ -d "/Applications/Google Chrome.app" ] || brew install --cask google-chrome'

      - name: Start chromedriver (chromedriver backend)
        if: matrix.backend == 'chromedriver' && (matrix.group == 'p3' || matrix.group == 'p4')
        run: |
          ./scripts/eddy-tooling
          vendor/bin/eddy-browser start

      - name: Install PHP test dependencies
        run: composer install --no-interaction
        working-directory: .eddy/tests

      - name: Validate composer.json
        if: matrix.group == 'p0'
        run: composer validate --strict
        working-directory: .eddy/tests

      - name: Check composer.json is normalized
        if: matrix.group == 'p0'
        run: composer normalize --dry-run
        working-directory: .eddy/tests

      - name: Validate tooling composer.json
        if: matrix.group == 'p0'
        run: composer validate --strict
        working-directory: .eddy/tooling

      - name: Check tooling composer.json is normalized
        if: matrix.group == 'p0'
        run: composer normalize --dry-run ../tooling/composer.json
        working-directory: .eddy/tests

      - name: Lint PHP tests
        if: matrix.group == 'p0'
        run: composer lint
        working-directory: .eddy/tests

      - name: Run PHP tests with coverage
        if: matrix.group != 'p5'
        run: composer test-coverage -- --group="${GROUP}"
        working-directory: .eddy/tests
        env:
          GROUP: ${{ matrix.group }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBSERVER_HOST: ${{ (matrix.group == 'p3' || matrix.group == 'p4') && '0.0.0.0' || 'localhost' }}
          WEBDRIVER_BACKEND: ${{ (matrix.group == 'p3' || matrix.group == 'p4') && matrix.backend || '' }}

      # p5 runs without coverage because the runner is configured with xdebug
      # (not pcov) for the XDebug toggle behaviour test.
      - name: Run PHP tests
        if: matrix.group == 'p5'
        run: composer test -- --group="${GROUP}"
        working-directory: .eddy/tests
        env:
          GROUP: ${{ matrix.group }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage report as an artifact
        if: matrix.group != 'p5'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ github.job }}-code-coverage-report-${{ matrix.os }}-${{ matrix.group }}-${{ matrix.backend }}
          path: .eddy/tests/.logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        if: ${{ env.CODECOV_TOKEN != '' && matrix.group != 'p5' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          directory: .eddy/tests/.logs
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  scaffold-test-actions:
    runs-on: ubuntu-26.04

    permissions:
      contents: read # Read workflows for the GitHub Actions linters.
      security-events: write # Upload Zizmor SARIF results to code scanning.
      actions: read # Required by code scanning SARIF upload on private repositories.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check coding standards with yamllint
        run: yamllint --config-file .eddy/tests/.yamllint-for-gha.yml .github/workflows
        continue-on-error: ${{ vars.CI_YAMLLINT_IGNORE_FAILURE == '1' }}

      - name: Check coding standards with actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE:-.}":/app --workdir /app kjanat/actionlint:1.17.0@sha256:d484cccadf56b6a356466ade9af4c8e05c5dce1badaf0a9ecd0d7639d68d9c92 -ignore 'SC2002:' -ignore 'SC2155:'
        continue-on-error: ${{ vars.CI_ACTIONLINT_IGNORE_FAILURE == '1' }}

      - name: Check GitHub Actions security with Zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # The init fixtures hold workflows with placeholder action refs, so
          # auditing the whole repository reports every ref as unpinned.
          inputs: .github
          config: .eddy/tests/zizmor.yml
        continue-on-error: ${{ vars.CI_ZIZMOR_IGNORE_FAILURE == '1' }}
