name: Release Eddy installer

# Attaches 'install.php', the template archive it downloads, 'SHA256SUMS' and
# 'SHA256SUMS.asc' to a release, with a build attestation for every file but
# the signature. eddy.drevops.com/install redirects to the 'install.php' of the
# latest release.
#
# A manual run attaches the files to an existing release again.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, which must be an existing tag.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eddy-release-installer-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  eddy-release-installer:
    if: github.repository == 'drevops/eddy'

    runs-on: ubuntu-26.04

    # The signing key is a secret of this environment, so its protection rules
    # apply before the job can read the key.
    environment: release

    permissions:
      contents: write # Upload the release assets.
      id-token: write # Sign the attestations.
      attestations: write # Record the attestations.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.3

      # The version becomes part of asset names and URLs, so it is limited to
      # the characters that a tag of this repository uses.
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG:-${INPUTS_VERSION}}"
          [[ "${version}" =~ ^[0-9A-Za-z._+-]+$ ]] || { echo "::error::Invalid release version '${version}'."; exit 1; }
          git show-ref --verify --quiet "refs/tags/${version}" || { echo "::error::Version ${version} is not a tag of this repository."; exit 1; }
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=eddy-${version}.tar.gz" >> "$GITHUB_ENV"
          echo "Release version: ${version}"

      # Installers already stamped with the checksum of a published archive
      # keep working, because a later run reuses that archive.
      - name: Publish template archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release
          if gh release download "${RELEASE_VERSION}" --pattern "${RELEASE_ARCHIVE}" --dir .release; then
            echo "Reusing ${RELEASE_ARCHIVE} from release ${RELEASE_VERSION}."
          else
            git archive --format=tar.gz --prefix="eddy-${RELEASE_VERSION}/" --output=".release/${RELEASE_ARCHIVE}" "refs/tags/${RELEASE_VERSION}"
            gh release upload "${RELEASE_VERSION}" ".release/${RELEASE_ARCHIVE}"
          fi
          sha256="$(sha256sum ".release/${RELEASE_ARCHIVE}" | cut -d ' ' -f 1)"
          echo "RELEASE_ARCHIVE_SHA256=${sha256}" >> "$GITHUB_ENV"
          echo "Template archive: ${RELEASE_ARCHIVE} (${sha256})"

      # Reads the installer from the tag, so a manual run on the default branch
      # stamps the installer of the release it names.
      - name: Build installer
        run: |
          git show "refs/tags/${RELEASE_VERSION}:install.php" > "${RUNNER_TEMP}/install.php"
          archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/${RELEASE_ARCHIVE}"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .eddy/docs/scripts/stamp-installer.mjs "${RUNNER_TEMP}/install.php" .release/install.php "${RELEASE_VERSION}" "${archive_url}" "${RELEASE_ARCHIVE_SHA256}"
          reported="$(php .release/install.php --version)"
          [ "${reported}" = "${RELEASE_VERSION}" ] || { echo "::error::The installer reports version '${reported}', not '${RELEASE_VERSION}'."; exit 1; }

      # Runs the installer in an empty directory, as a user does, so it
      # downloads the archive of its release and verifies its checksum.
      - name: Check installer
        env:
          INSTALL_NAME: Installer Check
          INSTALL_MACHINE_NAME: installer_check
          INSTALL_TYPE: module
          INSTALL_DRUPAL_VERSION: '11'
          INSTALL_COMMAND_WRAPPER: makefile
          INSTALL_TOOLS: phpcs,phpunit
          INSTALL_EXAMPLES: 'false'
          INSTALL_REMOVE_SELF: 'true'
          INSTALL_PROCEED: 'true'
        run: |
          mkdir installer-check
          cp .release/install.php installer-check/install.php
          cd installer-check
          php install.php | tee ../installer-check.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || exit 1
          [ -f installer_check.info.yml ] || { echo '::error::The installer did not install the extension.'; exit 1; }
          if grep -q 'so the template is not verified' ../installer-check.log; then
            echo '::error::The installer did not verify the template archive.'
            exit 1
          fi

      - name: Generate checksums
        working-directory: .release
        run: sha256sum install.php "${RELEASE_ARCHIVE}" > SHA256SUMS

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "${GPG_PRIVATE_KEY}" ] || { echo "::error::The GPG_PRIVATE_KEY secret of the 'release' environment is not set."; exit 1; }
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      # GPG_PASSPHRASE is needed only for a key that has a passphrase.
      - name: Sign checksums
        working-directory: .release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor SHA256SUMS
          else
            gpg --batch --yes --detach-sign --armor SHA256SUMS
          fi

      # The signature must come from the pinned fingerprint of the published
      # key, not from any key that the keyring holds.
      - name: Verify signature
        run: php .eddy/installer/verify-release.php .release

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/install.php
            .release/${{ env.RELEASE_ARCHIVE }}
            .release/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_VERSION}" .release/install.php .release/SHA256SUMS .release/SHA256SUMS.asc --clobber

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .uploaded
          gh release download "${RELEASE_VERSION}" --dir .uploaded --pattern install.php --pattern "${RELEASE_ARCHIVE}" --pattern SHA256SUMS --pattern SHA256SUMS.asc
          php .eddy/installer/verify-release.php .uploaded
          for file in install.php "${RELEASE_ARCHIVE}" SHA256SUMS; do
            gh attestation verify ".uploaded/${file}" --repo "${GITHUB_REPOSITORY}"
          done

      # Each URL must serve the uploaded installer byte for byte.
      - name: Verify latest installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "${latest}" != "${RELEASE_VERSION}" ]; then
            echo "Release ${RELEASE_VERSION} is not the latest release (${latest}), so the latest download is not checked."
            exit 0
          fi
          for url in "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.php" https://eddy.drevops.com/install; do
            curl -fsSL "${url}" -o latest-install.php
            cmp latest-install.php .release/install.php || { echo "::error::${url} does not serve the uploaded installer."; exit 1; }
            echo "${url} serves the uploaded installer."
          done
