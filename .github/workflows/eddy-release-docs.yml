name: Release Eddy docs

# Publishes '.eddy/docs' to GitHub Pages on a release tag, or on a manual run.
# The site holds no installer: 'eddy-release-installer.yml' attaches it to the
# release.
#
# The site URL and base path come from the GitHub Pages settings at build
# time, so a custom domain set there takes effect on the next run.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, which must be an existing tag. Leave empty for the tag, or the git describe output of the branch.'
        required: false
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eddy-release-docs:
    if: github.repository == 'drevops/eddy'

    runs-on: ubuntu-26.04

    permissions:
      contents: read # Read the documentation source.
      pages: write # Deploy the built site with 'actions/deploy-pages'.
      id-token: write # Authenticate 'actions/deploy-pages' to GitHub Pages.

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 'git describe' reads the tags and the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set release version
        env:
          INPUTS_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${INPUTS_VERSION}" ]; then
            version="${INPUTS_VERSION}"
            git show-ref --verify --quiet "refs/tags/${version}" || { echo "::error::Version ${version} is not a tag of this repository."; exit 1; }
          elif [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME}"
          else
            version="$(git describe --tags --always)"
          fi
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Release version: ${version}"

      - name: Install dependencies
        run: npm ci
        working-directory: .eddy/docs

      - name: Build documentation site
        run: npm run build
        working-directory: .eddy/docs
        env:
          DOCS_URL: ${{ steps.pages.outputs.origin }}
          DOCS_BASE_URL: ${{ steps.pages.outputs.base_path }}/

      # A copy at '/install' would be the installer of this build, not of the
      # latest release.
      - name: Check that the site holds no installer
        run: |
          [ ! -e .eddy/docs/build/install ] || { echo '::error::The release build holds an installer at /install.'; exit 1; }

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .eddy/docs/build

      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
