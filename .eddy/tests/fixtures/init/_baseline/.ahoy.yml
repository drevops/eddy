# Ahoy configuration file.
# http://www.ahoycli.com/
---
ahoyapi: v2

env:
  - .env

commands:

  build:
    usage: Build or rebuild the project.
    cmd: |
      ahoy stop > /dev/null 2>&1 || true
      ahoy assemble
      ahoy start
      ahoy provision

  assemble:
    usage: Assemble a codebase using project code and all required dependencies.
    cmd: vendor/bin/eddy-assemble

  start:
    usage: Start development environment.
    aliases: [debug-off, xdebug-off]
    cmd: vendor/bin/eddy-start

  stop:
    usage: Stop development environment.
    cmd: vendor/bin/eddy-stop

  info:
    usage: Print a read-only summary of the current environment.
    aliases: [describe]
    cmd: vendor/bin/eddy-info

  debug:
    usage: Enable PHP XDebug step-debugging for the development server.
    aliases: [debug-on, xdebug, xdebug-on]
    cmd: |
      [ "$(vendor/bin/eddy-info xdebug)" = "enabled" ] && echo "XDebug is already enabled. Run 'ahoy start' to disable." || \
      (XDEBUG=1 vendor/bin/eddy-start && sleep 1 && [ "$(vendor/bin/eddy-info xdebug)" = "enabled" ] && echo "Enabled XDebug. Run 'ahoy start' to disable." || (echo "Failed to enable XDebug." && exit 1))

  provision:
    usage: Provision application within assembled codebase.
    cmd: vendor/bin/eddy-provision

  drush:
    usage: Run Drush command.
    cmd: build/vendor/bin/drush -l "$(vendor/bin/eddy-info site-url)" "$@"

  login:
    usage: Login to a website.
    cmd: |
      url="$(ahoy drush uli)"
      printf '%s\n' "$url"
      if [ -n "$LOGIN_QRCODE" ]; then vendor/bin/eddy-qrcode "$url"; fi

  lint:
    usage: Check coding standards for violations.
    cmd: |
      pushd "build" >/dev/null || exit 1
      ahoy title "Running PHPCS"
      vendor/bin/phpcs
      ahoy title "Running PHPStan"
      vendor/bin/phpstan
      ahoy title "Running Rector"
      vendor/bin/rector --clear-cache --dry-run
      ahoy title "Running Twig CS Fixer"
      vendor/bin/twig-cs-fixer
      [ ! -d node_modules ] || (ahoy title "Running ESLint" && npm run lint)
      popd >/dev/null || exit 1
      ahoy title "Running CSpell"
      [ -d node_modules ] || npm install --no-audit --no-fund
      npm run lint-spell

  lint-fix:
    usage: Fix violations in coding standards.
    cmd: |
      pushd "build" >/dev/null || exit 1
      ahoy title "Running Rector"
      vendor/bin/rector --clear-cache
      ahoy title "Running PHPCBF"
      vendor/bin/phpcbf
      ahoy title "Running Twig CS Fixer"
      vendor/bin/twig-cs-fixer --no-cache --fix
      [ ! -d node_modules ] || (ahoy title "Running ESLint" && npm run lint-fix)
      popd >/dev/null || exit 1

  test:
    usage: Run all tests.
    cmd: |
      pushd "build" >/dev/null || exit 1
      ahoy title "Running PHPUnit"
      php -d pcov.directory=.. vendor/bin/phpunit "$@"
      [ ! -d node_modules ] || (ahoy title "Running Jest" && npm test)
      popd >/dev/null || exit 1

  test-unit:
    usage: Run unit tests.
    cmd: |
      pushd "build" >/dev/null || exit 1
      php -d pcov.directory=.. vendor/bin/phpunit --testsuite unit "$@"
      popd >/dev/null || exit 1

  test-kernel:
    usage: Run kernel tests.
    cmd: |
      pushd "build" >/dev/null || exit 1
      php -d pcov.directory=.. vendor/bin/phpunit --testsuite kernel "$@"
      popd >/dev/null || exit 1

  test-functional:
    usage: Run functional tests.
    cmd: |
      pushd "build" >/dev/null || exit 1
      php -d pcov.directory=.. vendor/bin/phpunit --testsuite functional "$@"
      popd >/dev/null || exit 1

  test-functional-javascript:
    usage: Run FunctionalJavascript tests.
    cmd: |
      ahoy browser-start || exit 1
      export WEBDRIVER_PORT="$(vendor/bin/eddy-info webdriver-port)"
      pushd "build" >/dev/null || exit 1
      php -d pcov.directory=.. vendor/bin/phpunit --testsuite functional-javascript "$@"
      popd >/dev/null || exit 1

  test-javascript:
    usage: Run JavaScript unit tests.
    aliases: [test-js]
    cmd: |
      pushd "build" >/dev/null || exit 1
      [ ! -d node_modules ] || npm test
      popd >/dev/null || exit 1

  browser-start:
    usage: Start the browser for FunctionalJavascript tests.
    cmd: vendor/bin/eddy-browser-start

  browser-stop:
    usage: Stop the browser.
    cmd: vendor/bin/eddy-browser-stop

  reset:
    usage: Reset project to the default state.
    aliases: [delete, destroy]
    cmd: |
      killall -9 php >/dev/null 2>&1 || true
      chmod -Rf 777 build .logs > /dev/null 2>&1 || true
      rm -Rf build > /dev/null 2>&1 || true
      rm -Rf .logs > /dev/null 2>&1 || true
      rm -Rf vendor > /dev/null 2>&1 || true

  title:
    usage: Print a section title.
    cmd: echo -e "\n\033[36m$@\033[0m"
    hide: true

# Override entrypoint to alter default behaviour of Ahoy.
entrypoint:
  - bash
  - -c
  - -e
  - |
    # Resolve a relative TMPDIR to an absolute path so tools that chdir (pushd
    # build) still find it. No-op when unset or already absolute.
    if [ -n "${TMPDIR:-}" ]; then case "$TMPDIR" in /*) ;; *) TMPDIR="$PWD/$TMPDIR" ;; esac; mkdir -p "$TMPDIR"; export TMPDIR; fi
    # 'reset' skips the install, so it still cleans up when the install fails.
    # Progress goes to stderr, so a captured command output holds only the
    # command's own.
    if [ -z "${AHOY_EDDY_TOOLING_READY:-}" ] && [ "$1" != "reset" ]; then export AHOY_EDDY_TOOLING_READY=1; ./scripts/eddy-tooling >&2; fi
    extension="$(basename -s .info.yml -- ./*.info.yml)"
    export BROWSERTEST_OUTPUT_DIRECTORY="$PWD/.logs/browser_output"
    export SIMPLETEST_BASE_URL=http://${WEBSERVER_HOST:-localhost}:${WEBSERVER_PORT:-8000}
    export SIMPLETEST_DB=sqlite://localhost/drupal_test_${extension}.sqlite
    bash -e -c "$0" "$@"
  - '{{cmd}}'
  - '{{name}}'
