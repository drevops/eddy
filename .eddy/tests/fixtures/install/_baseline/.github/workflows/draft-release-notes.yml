name: Draft release notes

on:
  push:
    tags:
      - '*'
    branches:
      - 1.x

permissions:
  contents: read

jobs:
  release-drafter:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-26.04

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@__HASH__ # __VERSION__
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
