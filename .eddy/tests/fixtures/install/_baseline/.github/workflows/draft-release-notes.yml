name: Draft release notes

on:
  push:
    branches:
      - 1.x

permissions: {}

# Overlapping runs can each create a draft, so runs queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-drafter:
    permissions:
      contents: write # Create and update the draft release.
      pull-requests: read # List the merged pull requests for the notes.

    runs-on: ubuntu-26.04

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@__HASH__ # __VERSION__
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
