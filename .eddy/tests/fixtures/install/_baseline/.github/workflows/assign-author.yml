name: 'Auto Author Assign'

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  contents: read

jobs:
  assign-author:
    runs-on: ubuntu-26.04

    permissions:
      pull-requests: write

    steps:
      - name: Assign author
        uses: toshimaru/auto-author-assign@__HASH__ # __VERSION__
