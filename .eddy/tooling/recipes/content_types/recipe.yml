# Adapted from the 'page_content_type' and 'article_content_type' recipes of
# Drupal 11.4. Drupal 12 removes both recipes and the 'text_with_summary' field
# type, so the body is a 'text_long' field. Basic page has its displays in
# config files and Article in config actions, as in those recipes.
name: 'Content types'
description: 'Provides the Basic page and Article content types.'
type: 'Content type'
install:
  - image
  - node
  - path
config:
  strict:
    # Treat field storages strictly, since they influence the database layout.
    - field.storage.node.field_image
  import:
    node:
      - core.entity_view_mode.node.full
      - core.entity_view_mode.node.rss
      - core.entity_view_mode.node.teaser
      - system.action.node_delete_action
      - system.action.node_make_sticky_action
      - system.action.node_make_unsticky_action
      - system.action.node_promote_action
      - system.action.node_publish_action
      - system.action.node_save_action
      - system.action.node_unpromote_action
      - system.action.node_unpublish_action
    image:
      - image.style.medium
      - image.style.thumbnail
      - image.style.wide
  actions:
    core.entity_form_display.node.article.default:
      createIfNotExists:
        targetEntityType: node
        bundle: article
        mode: default
        status: true
      setComponents:
        - name: body
          options:
            type: text_textarea
            weight: 2
            region: content
        - name: created
          options:
            type: datetime_timestamp
            weight: 10
            region: content
        - name: field_image
          options:
            type: image_image
            weight: 1
            region: content
        - name: path
          options:
            type: path
            weight: 30
            region: content
        - name: promote
          options:
            type: boolean_checkbox
            weight: 15
            region: content
        - name: status
          options:
            type: boolean_checkbox
            weight: 120
            region: content
        - name: sticky
          options:
            type: boolean_checkbox
            weight: 16
            region: content
        - name: title
          options:
            type: string_textfield
            weight: 0
            region: content
        - name: uid
          options:
            type: entity_reference_autocomplete
            weight: 5
            region: content
    core.entity_view_display.node.article.default:
      createIfNotExists:
        targetEntityType: node
        bundle: article
        mode: default
        status: true
      setComponents:
        - name: body
          options:
            type: text_default
            label: hidden
            weight: 0
            region: content
        - name: field_image
          options:
            type: image
            label: hidden
            settings:
              image_style: wide
              image_loading:
                attribute: eager
            weight: -1
            region: content
        - name: links
          options:
            weight: 100
            region: content
    core.entity_view_display.node.article.rss:
      createIfNotExists:
        targetEntityType: node
        bundle: article
        mode: rss
        status: true
        content:
          links:
            weight: 100
            region: content
    core.entity_view_display.node.article.teaser:
      createIfNotExists:
        targetEntityType: node
        bundle: article
        mode: teaser
        status: true
        content:
          links:
            weight: 100
            region: content
      setComponents:
        - name: body
          options:
            type: text_trimmed
            label: hidden
            settings:
              trim_length: 600
            weight: 0
            region: content
        - name: field_image
          options:
            type: image
            label: hidden
            settings:
              image_style: medium
              image_link: content
            weight: -1
            region: content
    # The permissions that the Standard recipe grants the role for each
    # content type.
    user.role.content_editor:
      grantPermissionsForEachNodeType:
        - 'create %bundle content'
        - 'delete %bundle revisions'
        - 'delete own %bundle content'
        - 'edit own %bundle content'
